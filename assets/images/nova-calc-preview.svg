<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="novaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="violetNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#novaBg)"/>

  <!-- Window Header -->
  <rect x="0" y="0" width="800" height="42" rx="16" fill="#131b2e"/>
  <rect x="0" y="26" width="800" height="16" fill="#131b2e"/>
  <circle cx="28" cy="21" r="6" fill="#ef4444"/>
  <circle cx="48" cy="21" r="6" fill="#f59e0b"/>
  <circle cx="68" cy="21" r="6" fill="#10b981"/>
  <text x="400" y="26" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" font-weight="500">nova-calc.engine / scientific v2.4</text>

  <!-- Left: Calculator Chassis -->
  <g transform="translate(60, 65)">
    <!-- Chassis Body -->
    <rect width="400" height="395" rx="20" fill="#111827" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.5"/>

    <!-- Display Screen -->
    <rect x="20" y="20" width="360" height="95" rx="12" fill="#030712" stroke="rgba(255,255,255,0.08)"/>
    <text x="365" y="48" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="14" text-anchor="end">sin(45°) × √2 + π</text>
    <text x="365" y="90" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="34" font-weight="700" text-anchor="end">3.855734</text>
    <text x="35" y="50" fill="#06b6d4" font-family="system-ui" font-size="11" font-weight="700">RAD</text>
    <text x="35" y="88" fill="#a855f7" font-family="system-ui" font-size="11" font-weight="700">SCI</text>

    <!-- Keypad Matrix (Visual buttons) -->
    <!-- Row 1 -->
    <rect x="20" y="130" width="62" height="44" rx="8" fill="#1f293d"/>
    <text x="51" y="157" fill="#38bdf8" font-family="system-ui" font-size="12" font-weight="600" text-anchor="middle">sin</text>

    <rect x="94" y="130" width="62" height="44" rx="8" fill="#1f293d"/>
    <text x="125" y="157" fill="#38bdf8" font-family="system-ui" font-size="12" font-weight="600" text-anchor="middle">cos</text>

    <rect x="168" y="130" width="62" height="44" rx="8" fill="#1f293d"/>
    <text x="199" y="157" fill="#38bdf8" font-family="system-ui" font-size="12" font-weight="600" text-anchor="middle">tan</text>

    <rect x="242" y="130" width="62" height="44" rx="8" fill="#1f293d"/>
    <text x="273" y="157" fill="#38bdf8" font-family="system-ui" font-size="12" font-weight="600" text-anchor="middle">log</text>

    <rect x="316" y="130" width="64" height="44" rx="8" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="1"/>
    <text x="348" y="157" fill="#f87171" font-family="system-ui" font-size="12" font-weight="700" text-anchor="middle">AC</text>

    <!-- Row 2 -->
    <rect x="20" y="184" width="62" height="44" rx="8" fill="#1e293b"/>
    <text x="51" y="211" fill="#e2e8f0" font-family="system-ui" font-size="14" font-weight="600" text-anchor="middle">7</text>

    <rect x="94" y="184" width="62" height="44" rx="8" fill="#1e293b"/>
    <text x="125" y="211" fill="#e2e8f0" font-family="system-ui" font-size="14" font-weight="600" text-anchor="middle">8</text>

    <rect x="168" y="184" width="62" height="44" rx="8" fill="#1e293b"/>
    <text x="199" y="211" fill="#e2e8f0" font-family="system-ui" font-size="14" font-weight="600" text-anchor="middle">9</text>

    <rect x="242" y="184" width="62" height="44" rx="8" fill="#334155"/>
    <text x="273" y="211" fill="#38bdf8" font-family="system-ui" font-size="16" font-weight="700" text-anchor="middle">÷</text>

    <rect x="316" y="184" width="64" height="44" rx="8" fill="#334155"/>
    <text x="348" y="211" fill="#38bdf8" font-family="system-ui" font-size="16" font-weight="700" text-anchor="middle">×</text>

    <!-- Row 3 & 4 (Abbreviated visual) -->
    <rect x="20" y="238" width="62" height="44" rx="8" fill="#1e293b"/><text x="51" y="265" fill="#e2e8f0" font-family="system-ui" font-size="14" font-weight="600" text-anchor="middle">4</text>
    <rect x="94" y="238" width="62" height="44" rx="8" fill="#1e293b"/><text x="125" y="265" fill="#e2e8f0" font-family="system-ui" font-size="14" font-weight="600" text-anchor="middle">5</text>
    <rect x="168" y="238" width="62" height="44" rx="8" fill="#1e293b"/><text x="199" y="265" fill="#e2e8f0" font-family="system-ui" font-size="14" font-weight="600" text-anchor="middle">6</text>
    <rect x="242" y="238" width="62" height="44" rx="8" fill="#334155"/><text x="273" y="265" fill="#38bdf8" font-family="system-ui" font-size="16" font-weight="700" text-anchor="middle">−</text>
    <rect x="316" y="238" width="64" height="44" rx="8" fill="#334155"/><text x="348" y="265" fill="#38bdf8" font-family="system-ui" font-size="16" font-weight="700" text-anchor="middle">+</text>

    <!-- Bottom Row with Equals Accent -->
    <rect x="20" y="292" width="62" height="44" rx="8" fill="#1e293b"/><text x="51" y="319" fill="#e2e8f0" font-family="system-ui" font-size="14" font-weight="600" text-anchor="middle">0</text>
    <rect x="94" y="292" width="62" height="44" rx="8" fill="#1e293b"/><text x="125" y="319" fill="#e2e8f0" font-family="system-ui" font-size="14" font-weight="600" text-anchor="middle">.</text>
    <rect x="168" y="292" width="62" height="44" rx="8" fill="#1e293b"/><text x="199" y="319" fill="#e2e8f0" font-family="system-ui" font-size="14" font-weight="600" text-anchor="middle">π</text>
    <rect x="242" y="292" width="138" height="44" rx="8" fill="url(#cyanNeon)"/>
    <text x="311" y="320" fill="#ffffff" font-family="system-ui" font-size="20" font-weight="700" text-anchor="middle">=</text>
  </g>

  <!-- Right: Calculation History Panel -->
  <g transform="translate(490, 65)">
    <rect width="250" height="395" rx="16" fill="#111827" stroke="rgba(255,255,255,0.06)"/>
    <text x="24" y="40" fill="#f8fafc" font-family="system-ui" font-size="16" font-weight="700">Audit History</text>
    <rect x="180" y="24" width="48" height="22" rx="11" fill="#1e293b"/>
    <text x="204" y="38" fill="#94a3b8" font-family="system-ui" font-size="10" font-weight="600" text-anchor="middle">CLEAR</text>

    <!-- History Items -->
    <g transform="translate(20, 65)">
      <rect width="210" height="60" rx="10" fill="#0f172a" stroke="rgba(255,255,255,0.04)"/>
      <text x="195" y="24" fill="#94a3b8" font-family="monospace" font-size="12" text-anchor="end">256 × 1.25</text>
      <text x="195" y="48" fill="#38bdf8" font-family="monospace" font-size="16" font-weight="700" text-anchor="end">320</text>
    </g>

    <g transform="translate(20, 135)">
      <rect width="210" height="60" rx="10" fill="#0f172a" stroke="rgba(255,255,255,0.04)"/>
      <text x="195" y="24" fill="#94a3b8" font-family="monospace" font-size="12" text-anchor="end">√(1024) + 18</text>
      <text x="195" y="48" fill="#a855f7" font-family="monospace" font-size="16" font-weight="700" text-anchor="end">50</text>
    </g>

    <g transform="translate(20, 205)">
      <rect width="210" height="60" rx="10" fill="#0f172a" stroke="rgba(255,255,255,0.04)"/>
      <text x="195" y="24" fill="#94a3b8" font-family="monospace" font-size="12" text-anchor="end">15% of 850</text>
      <text x="195" y="48" fill="#38bdf8" font-family="monospace" font-size="16" font-weight="700" text-anchor="end">127.5</text>
    </g>
  </g>
</svg>