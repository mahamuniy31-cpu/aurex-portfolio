<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#09090c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="neonRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fba16c"/>
    </linearGradient>
  </defs>

  <!-- Dark container background with subtle mesh glow -->
  <rect width="500" height="500" rx="36" fill="#0c0c12"/>
  <circle cx="250" cy="240" r="210" fill="url(#halo)"/>

  <!-- Code/Tech subtle background grid lines -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="500"/>
    <line x1="150" y1="0" x2="150" y2="500"/>
    <line x1="250" y1="0" x2="250" y2="500"/>
    <line x1="350" y1="0" x2="350" y2="500"/>
    <line x1="450" y1="0" x2="450" y2="500"/>
    <line x1="0" y1="100" x2="500" y2="100"/>
    <line x1="0" y1="200" x2="500" y2="200"/>
    <line x1="0" y1="300" x2="500" y2="300"/>
    <line x1="0" y1="400" x2="500" y2="400"/>
  </g>

  <!-- Glowing outer circular badge -->
  <circle cx="250" cy="240" r="160" fill="#13131e" stroke="url(#neonRim)" stroke-width="3" stroke-dasharray="10 6"/>

  <!-- Developer silhouette & features -->
  <!-- Shoulders & Hoodie -->
  <path d="M 130 460 C 140 370, 200 330, 250 330 C 300 330, 360 370, 370 460 Z" fill="url(#bodyGrad)" stroke="url(#neonRim)" stroke-width="2"/>
  <path d="M 210 335 L 250 395 L 290 335" fill="none" stroke="#6366f1" stroke-width="3"/>

  <!-- Neck -->
  <rect x="230" y="270" width="40" height="60" rx="10" fill="url(#skin)"/>

  <!-- Head -->
  <ellipse cx="250" cy="210" rx="65" ry="75" fill="url(#skin)"/>

  <!-- Modern Haircut -->
  <path d="M 180 200 C 180 130, 220 115, 250 115 C 290 115, 325 135, 320 200 C 310 160, 280 140, 240 140 C 205 140, 188 170, 180 200 Z" fill="#1e1b2e"/>

  <!-- Stylish Developer Glasses -->
  <rect x="200" y="195" width="42" height="26" rx="6" fill="rgba(147, 51, 234, 0.25)" stroke="#c084fc" stroke-width="3"/>
  <rect x="258" y="195" width="42" height="26" rx="6" fill="rgba(147, 51, 234, 0.25)" stroke="#c084fc" stroke-width="3"/>
  <line x1="242" y1="208" x2="258" y2="208" stroke="#c084fc" stroke-width="3"/>
  
  <!-- Subtle Smile -->
  <path d="M 235 255 Q 250 268 265 255" fill="none" stroke="#b45309" stroke-width="3" stroke-linecap="round"/>

  <!-- Floating Tech Badges -->
  <g transform="translate(60, 130)">
    <rect width="110" height="34" rx="17" fill="rgba(24, 24, 37, 0.9)" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1.5"/>
    <circle cx="20" cy="17" r="5" fill="#10b981"/>
    <text x="34" y="22" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Frontend</text>
  </g>

  <g transform="translate(340, 310)">
    <rect width="105" height="34" rx="17" fill="rgba(24, 24, 37, 0.9)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5"/>
    <circle cx="20" cy="17" r="5" fill="#38bdf8"/>
    <text x="34" y="22" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Vanilla JS</text>
  </g>

  <g transform="translate(70, 360)">
    <rect width="115" height="34" rx="17" fill="rgba(24, 24, 37, 0.9)" stroke="rgba(236, 72, 153, 0.4)" stroke-width="1.5"/>
    <circle cx="20" cy="17" r="5" fill="#ec4899"/>
    <text x="34" y="22" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Code Alpha</text>
  </g>
</svg>